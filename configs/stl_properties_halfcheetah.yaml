# STL Safety Property Specifications for HalfCheetah-v5
# HalfCheetah: 2D planar running robot
# Calibrated to P99/P1 of nominal signal distributions:
#   Pitch: range [-1.56, +1.56] → threshold ±1.2 rad
#   Height: P1 = 0.116 → threshold >0.10m
#   Airborne: 94% at 2, 5% at 1 → threshold ≤2 (contact not meaningful for running gait)
# Note: velocity_tracking removed — policy does not learn forward motion at 200k steps

properties:
  stability_pitch:
    name: "Pitch Stability"
    description: "Pitch angle stays within ±1.2 rad (covers ~95% of nominal range)"
    formula: "G[0,1000](pitch >= {neg_threshold} and pitch <= {pos_threshold})"
    variables:
      pitch: "body_pitch"
    parameters:
      neg_threshold: -1.2
      pos_threshold: 1.2
    weight: 1.0

  no_falls:
    name: "No Falls"
    description: "Base height stays above 0.10m minimum (P1 of nominal = 0.116)"
    formula: "G[0,1000](height > {h_min})"
    variables:
      height: "body_height"
    parameters:
      h_min: 0.10
    weight: 1.0

  contact_safety:
    name: "Contact Safety"
    description: "At most 2 feet airborne (HalfCheetah has 2 feet, airborne most of running gait)"
    formula: "G[0,1000](airborne_count <= {max_airborne})"
    variables:
      airborne_count: "n_airborne_feet"
    parameters:
      max_airborne: 2
    weight: 0.8

  recovery_bound:
    name: "Recovery Bound"
    description: "After height drops below 0.12m, recover to 0.15m within 50 steps"
    formula: "G[0,1000]((height <= {h_trigger}) -> F[0,{T}](height > {h_min}))"
    variables:
      height: "body_height"
    parameters:
      h_trigger: 0.12
      h_min: 0.15
      T: 50
    weight: 0.8
