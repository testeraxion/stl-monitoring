# Distribution shift / perturbation testing configuration

perturbations:
  terrain:
    enabled: true
    variations:
      - name: "friction_low"
        type: "friction"
        value: 0.3
      - name: "friction_high"
        type: "friction"
        value: 1.5
      - name: "roughness_mild"
        type: "terrain_roughness"
        value: 0.02
      - name: "roughness_extreme"
        type: "terrain_roughness"
        value: 0.1

  external_forces:
    enabled: true
    variations:
      - name: "push_small"
        magnitude: 5.0
        duration: 0.1
      - name: "push_medium"
        magnitude: 15.0
        duration: 0.1
      - name: "push_large"
        magnitude: 30.0
        duration: 0.1

  sensor_noise:
    enabled: true
    variations:
      - name: "noise_mild"
        type: "gaussian"
        std: 0.01
      - name: "noise_moderate"
        type: "gaussian"
        std: 0.05
      - name: "noise_severe"
        type: "gaussian"
        std: 0.15

  mass_randomization:
    enabled: true
    variations:
      - name: "mass_light"
        scale: 0.8
      - name: "mass_heavy"
        scale: 1.3
      - name: "mass_extreme"
        scale: 1.6

  observation_delay:
    enabled: false
    variations:
      - name: "delay_1step"
        steps: 1
      - name: "delay_3steps"
        steps: 3

evaluation:
  n_episodes_per_condition: 20
  n_seeds: 5
  report_variance: true
